      /* Print styles */
      @media print {
        body { background: none; }

        .printable-content { overflow: visible !important; height: auto !important; background: white !important; padding: 0 !important; }
        /* Reset A4 styles for actual printing to avoid double margins */
        .a4-paper { width: 100%; box-shadow: none; margin: 0; padding: 0; min-height: auto; }
        .a4-paper.landscape { width: 100%; min-height: auto; }
        
        h1, h2, h3 { page-break-after: avoid; }
        table { page-break-inside: auto; }
        tr { page-break-inside: avoid; page-break-after: auto; }
        
        /* Attempt to force landscape in print dialog for specific pages is tricky in SPA,
